# ------------------------------------------------------------------
# Área de interés (AOI) — archivo que cambia para replicar el proyecto
# en otra ciudad ribereña de la Amazonía colombiana.
# ------------------------------------------------------------------
nombre: "Leticia"
municipio: "Leticia"
departamento: "Amazonas"
codigo_divipola: "91001"
pais: "COL"
slug: "leticia"

# Punto de referencia (centro de la cabecera) y punto sobre el río Amazonas
centro: {lat: -4.2125, lon: -69.9406}
estacion_nivel: {codigo: "0048017010", nombre: "Leticia", lat: -4.2225, lon: -69.9427}
# Celda de GloFAS sobre el cauce principal del Amazonas aguas arriba de Leticia (caudal medio ~38 000 m³/s).
punto_glofas: {lat: -4.21, lon: -70.00}

# Extensión del área urbana de análisis (cabecera y periferia sobre la vía a Tarapacá).
# Se recorta con el límite municipal, de modo que Tabatinga (Brasil) queda fuera del análisis,
# aunque aparece en los mapas como contexto.
bbox_urbano: [-69.975, -4.235, -69.915, -4.150]   # lon_min, lat_min, lon_max, lat_max
# Tramo del río frente a Leticia (islas Santa Rosa y Rondiña, brazo colombiano) para la dinámica del cauce
bbox_rio: [-70.03, -4.27, -69.90, -4.16]
# Extensión regional (río, islas y bosques del entorno) para dinámica fluvial e incendios
bbox_regional: [-70.15, -4.32, -69.80, -4.05]
# Corredor del Amazonas dentro del municipio, de Leticia hasta el límite con Puerto Nariño: comunidades ribereñas
# para el análisis de aislamiento en aguas bajas
bbox_ribera: [-70.40, -4.30, -69.85, -3.70]
# Triple frontera (Colombia, Perú y Brasil) para la temporada regional de incendios y humo: el fuego que llega a
# Leticia como humo se quema sobre todo fuera del municipio
bbox_fuego: [-71.5, -5.5, -68.5, -2.5]
paises_fuego: ["Colombia", "Peru", "Brazil"]
# Municipio y vecinos en la triple frontera (panel intermedio del mapa de localización)
bbox_municipio: [-70.75, -4.45, -69.25, -2.80]

# Mapa de localización (página de inicio y cuaderno 2.6): extensión del panel de contexto, del panel municipal y rótulos
mapa:
  contexto: [-81.5, -17.0, -45.0, 12.5]     # norte de Suramérica (lon_min, lat_min, lon_max, lat_max)
  rotulos_contexto:
    - {texto: "COLOMBIA", lon: -73.6, lat: 4.2}
    - {texto: "VENEZUELA", lon: -66.0, lat: 7.3}
    - {texto: "ECUADOR", lon: -78.9, lat: -1.4}
    - {texto: "PERÚ", lon: -75.3, lat: -9.6}
    - {texto: "BRASIL", lon: -55.5, lat: -7.5}
    - {texto: "BOLIVIA", lon: -65.0, lat: -15.6}
    - {texto: "río Amazonas", lon: -64.5, lat: -2.75, rotacion: -4, rio: true}
  rotulos_municipio:
    - {texto: "PERÚ", lon: -70.45, lat: -4.36}
    - {texto: "BRASIL", lon: -69.45, lat: -3.30}
    - {texto: "río Amazonas", lon: -70.48, lat: -3.93, rotacion: 12, rio: true}
  rotulos_regional:
    - {texto: "Leticia", lon: -69.912, lat: -4.192, ciudad: true}
    - {texto: "Tabatinga (Brasil)", lon: -69.900, lat: -4.247}
    - {texto: "Santa Rosa (Perú)", lon: -69.965, lat: -4.27}
    - {texto: "río Amazonas", lon: -70.09, lat: -4.20, rotacion: -10, rio: true}

crs_trabajo: "EPSG:9377"     # MAGNA-SIRGAS / Origen-Nacional
crs_export: "EPSG:4326"
tamano_celda_m: 200          # malla de análisis (celdas cuadradas)

clima:
  periodo_base: [1991, 2020]
  escenarios: ["ssp126", "ssp245", "ssp585"]
  periodos_futuros: ["2040-2059", "2080-2099"]
  percentiles: ["p10", "median", "p90"]
