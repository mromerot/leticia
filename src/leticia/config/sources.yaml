    nivel: nacional
    tipo: socrata
    url: "https://www.datos.gov.co/resource/hp9r-jxuu.json"
    entidad: "IDEAM"
    producto: "Catálogo Nacional de Estaciones"
    escala: "punto"
    licencia: "Datos abiertos"
    verificado: "2026-10-28"
