    producto: "OpenDengue V1.3, extracto espacial (Colombia a nivel municipal, semanal)"
    escala: "municipal, semanal"
    licencia: "CC BY 4.0"
    url_ficha: "https://doi.org/10.6084/m9.figshare.24259573"
    verificado: "2026-10-28"

  estaciones_ideam:
    seccion: "2.4"
