name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar el paquete
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: pytest (datos sintéticos, sin red)
        run: pytest -q
