<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 48" role="img" aria-label="EVA">
  <title>EVA — Evaluación y análisis de riesgos de desastres</title>
  <!-- La E son las tres capas del riesgo sobre un eje: amenaza (río), exposición (territorio) y vulnerabilidad (tierra) -->
  <rect x="4" y="6" width="7" height="36" fill="#0B2545"/>
  <rect x="11" y="6" width="21" height="7" fill="#1A6FA3"/>
  <rect x="11" y="20.5" width="16.5" height="7" fill="#2E7D32"/>
  <rect x="11" y="35" width="21" height="7" fill="#C8811A"/>
  <!-- V -->
  <path d="M34.5 6 H42 L48 30 L54 6 H61.5 L51.8 42 H44.2 Z" fill="#0B2545"/>
  <!-- A: el hueco triangular es la señal de alerta -->
  <path d="M71.7 6 H79.3 L89 42 H81.5 L79.6 35 H71.4 L69.5 42 H62 Z M73 29 H78 L75.5 19.5 Z" fill="#0B2545" fill-rule="evenodd"/>
</svg>
